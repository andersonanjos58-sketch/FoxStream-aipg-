name: Build FoxStream APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build APK
        working-directory: android
        run: |
          rm -f local.properties
          chmod +x gradlew
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: foxstream-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 1

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          gh release delete v1.0.0-latest --cleanup-tag -y || true
          git tag -f v1.0.0-latest
          git push origin v1.0.0-latest --force || true
          gh release create v1.0.0-latest android/app/build/outputs/apk/debug/*.apk \
            --title "FoxStream APK (Build Automático)" \
            --notes "Versão compilada do aplicativo FoxStream Android." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
