name: Build FoxStream APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build APK
        working-directory: android
        run: |
          rm -f local.properties
          chmod +x gradlew
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: foxstream-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 1

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ncipollo/release-action@v1
        with:
          tag: "v1.0.0-latest"
          name: "FoxStream APK (Build Automático)"
          body: "Versão compilada do aplicativo FoxStream Android."
          artifacts: "android/app/build/outputs/apk/debug/*.apk"
          allowUpdates: true
          recreateRelease: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
